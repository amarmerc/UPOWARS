# nginx del HOST para el cliente web de UPOWARS. Copiar a /etc/nginx/sites-available/upowars.conf y enlazar en sites-enabled
# (ver servidor/README.md, "Jugar en el navegador"). Requiere el certificado de Let's Encrypt de upowars.amarmer.es.
#   - los ficheros estaticos (index.html, .wasm, .pck...) salen de /var/www/upowars (los copia servidor/exportar_web.sh)
#   - /ws es un proxy WebSocket al servidor de juego (contenedor servidor-web, solo en 127.0.0.1:7780)

# Conexion WebSocket: "upgrade" si el cliente lo pide (el "map" va en http{}: sites-enabled se incluye ahi).
map $http_upgrade $conexion_upowars {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name upowars.amarmer.es;

    # Renovaciones de certbot (--webroot / --nginx)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name upowars.amarmer.es;

    ssl_certificate     /etc/letsencrypt/live/upowars.amarmer.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upowars.amarmer.es/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_upowars:10m;
    ssl_session_timeout 1d;

    root /var/www/upowars;
    index index.html;

    # El .wasm y el .pck son grandes: comprimir lo que comprime bien (el .pck ya va comprimido por dentro, pero gzip aun gana en texto/.wasm)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/wasm application/octet-stream image/svg+xml;

    # Godot web: tipos MIME correctos (application/wasm es obligatorio para la compilacion en streaming)
    types {
        text/html                index.html htm html;
        text/css                 css;
        application/javascript   js mjs;
        application/wasm         wasm;
        application/octet-stream pck;
        application/json         json webmanifest;
        image/png                png;
        image/x-icon             ico;
        image/svg+xml            svg;
    }
    default_type application/octet-stream;

    # Cache: el HTML siempre se revalida (apunta a ficheros con nombre fijo); el resto, una hora con revalidacion por ETag
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = / {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(wasm|pck|js|png|ico)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # Servidor de juego por WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:7780;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion_upowars;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_socket_keepalive on;
    }
}

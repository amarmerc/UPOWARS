# Servidor dedicado de UPOWARS.   Uso (desde esta carpeta):  docker compose up -d --build
# Los parametros se pueden cambiar en un fichero servidor/.env (ver .env.ejemplo) o exportando las variables.
name: upowars

services:
  servidor:
    build:
      context: ..                       # raiz del repo (el Dockerfile copia game/)
      dockerfile: servidor/Dockerfile
    image: upowars-servidor:latest
    container_name: upowars-servidor
    restart: unless-stopped
    ports:
      - "${PUERTO:-7777}:${PUERTO:-7777}/udp"
    environment:
      PUERTO: "${PUERTO:-7777}"
      MAX: "${MAX:-10}"
      MODO: "${MODO:-cachimba_wars}"   # cachimba_wars | pleno | libre
      ZONA: "${ZONA:-plaza_america}"
      TAM: "${TAM:-5}"                 # jugadores por equipo (humanos + bots)
      RONDAS: "${RONDAS:-7}"
      DIFICULTAD: "${DIFICULTAD:-normal}"
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

